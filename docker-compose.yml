services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pozhnadzor
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres@db:5432/pozhnadzor
      JWT_SECRET_KEY: super-secret-key
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - '8000:8000'

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - '3000:3000'

volumes:
  postgres_data:
